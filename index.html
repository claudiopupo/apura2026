body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto}
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;position:sticky;top:0;z-index:5}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tx)}
.logo-img{height:52px;width:auto;display:block}
@media (prefers-color-scheme:dark){.logo-img,.foot-logo{background:#fff;border-radius:10px;padding:4px 8px}}
@media (max-width:520px){.logo-img{height:38px}.logo .sub{display:none}}
.foot-logo{display:block;height:64px;width:auto;margin:0 auto 10px}
.logo .sub{font-size:11px;color:var(--mut);line-height:1.2;border-left:1px solid var(--line);padding-left:10px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--tx);padding:7px 12px;cursor:pointer;font:inherit}
.seg button.on{background:var(--teal);color:#fff}
select,.btn{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer}
.btn:hover{border-color:var(--teal)}
.status{font-size:12px;color:var(--mut)}

/* anúncios */
.ad{max-width:970px;margin:14px auto;padding:0 16px}
.ad .slot{display:flex;align-items:center;justify-content:center;min-height:90px;border:1px dashed var(--line);border-radius:10px;background:var(--card);color:var(--mut);font-size:12px;text-align:center;overflow:hidden}
.ad .slot img{display:block;max-width:100%;height:auto}
.ad .lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
@media (max-width:600px){.ad .slot{min-height:60px}}

main{padding:0 16px 8px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{font-size:15px;margin:0 0 2px;display:flex;justify-content:space-between;gap:8px}
.card h2 .tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--teal2);color:var(--teal);white-space:nowrap}
.card h2 .tag.fim{background:var(--ok);color:#fff}
.meta{font-size:12px;color:var(--mut);margin-bottom:10px}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--teal);transition:width .6s}
.duel{display:flex;height:34px;border-radius:8px;overflow:hidden;margin-bottom:12px;font-weight:700;font-size:13px}
.duel div{display:flex;align-items:center;padding:0 10px;color:#fff;transition:flex-basis .6s;white-space:nowrap;overflow:hidden}
.duel div+div{justify-content:flex-end}
.cand{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 0;border-top:1px solid var(--line)}
.cand:first-of-type{border-top:0}
.cand .nm{font-weight:600}
.cand .nm small{font-weight:400;color:var(--mut)}
.cand .pc{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.cand .vt{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.bar{flex:1;height:7px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .6s}
.badge{font-size:11px;font-weight:700;color:#fff;background:var(--ok);padding:1px 6px;border-radius:5px;margin-left:6px}
.badge.sj{background:var(--warn)}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;font-size:12px}
.tot div{background:var(--bg);border-radius:8px;padding:6px 8px}
.tot b{display:block;font-size:14px;color:var(--tx)}
.msg{color:var(--mut);font-size:13px;padding:14px 0}
.msg.err{color:var(--err)}

/* comparativo */
#cmp{margin-top:14px}
#cmp h3{font-size:13px;margin:18px 0 8px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.crow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin:8px 0}
.crow .lb{font-size:13px;font-weight:600;line-height:1.2}
.crow .lb small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.stack{display:flex;height:30px;border-radius:7px;overflow:hidden;background:var(--line)}
.stack div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;transition:flex-basis .6s}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.evo svg{width:100%;height:auto;display:block;touch-action:pan-y}
.evo text{fill:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
.evo-wrap{position:relative}
.evo-tip{display:none;position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;min-width:170px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.evo-tip b{display:block;margin-bottom:4px}
.evo-tip div{display:flex;align-items:center;gap:6px}
.evo-tip div span{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.evo-tip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.evo-tip .dif{margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--mut)}
#cmp h3 .lead{text-transform:none;letter-spacing:0;margin-left:8px;font-weight:700}
@media (max-width:520px){.tot{grid-template-columns:repeat(2,1fr)}.crow{grid-template-columns:1fr}}
footer{font-size:12px;color:var(--mut);text-align:center;padding:6px 16px 30px}
footer a{color:var(--teal)}
</style>
</head>

<script>
/* ===== CONFIGURAÇÃO ===== */
const CFG = {
  BASE: 'https://resultados.tse.jus.br/oficial',
  PROXY: '',            // ex.: 'https://apuracao.SEUUSER.workers.dev/?u=' se o navegador bloquear por CORS
  CICLO: 'ele2026',
  REFRESH: 60,
  TURNOS: { 1:{fed:'6257', est:'6259'}, 2:{fed:'6258', est:'6260'} },
  UF_GOV: { 1:['MG','AC','AM','DF','ES','RN','TO','SP','RJ','BA','PR','RS'], 2:['AC','AM','DF','ES','RN','TO'] },
  MUN: { uf:'MG', nome:'VIÇOSA', cd:'' },
  ADS: {   // img + link = banner próprio; vazio = placeholder "Anuncie aqui"
    top:    { img:'', link:'', alt:'' },
    bottom: { img:'', link:'', alt:'' }
  },
  PALETA: ['#2c6e8f','#c0632a','#4f8a3a','#7b4f9e','#b03a5b','#2f9a92','#9a7d22','#5d6b78']
};

/* ===== ESTADO ===== */
const S = { turno:2, cargo:1, uf:null, auto:true, left:CFG.REFRESH, backoff:0, busy:false, colors:{}, ci:0 };
const $ = id => document.getElementById(id);
const pad = (n,l) => String(n).padStart(l,'0');
const num = s => parseFloat(String(s||'0').replace(',','.')) || 0;
const fmt = n => Number(n||0).toLocaleString('pt-BR');
const pct = n => n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
const ls = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function colorOf(n){ if (!S.colors[n]) S.colors[n] = CFG.PALETA[S.ci++ % CFG.PALETA.length]; return S.colors[n]; }

function u(path){ const full = CFG.BASE + '/' + path; return CFG.PROXY ? CFG.PROXY + encodeURIComponent(full) : full; }
async function getJSON(path){
  const r = await fetch(u(path), { cache:'no-cache' });
  if (!r.ok) { const e = new Error('HTTP '+r.status); e.status = r.status; throw e; }
  return r.json();
}
const resPath = (ele, abr, cargo) =>
  `${CFG.CICLO}/${ele}/dados/${abr.slice(0,2).toLowerCase()}/${abr.toLowerCase()}-c${pad(cargo,4)}-e${pad(ele,6)}-u.json`;

async function initCiclo(){
  try { const j = await getJSON('comum/config/ele-c.json'); if (j && typeof j.c === 'string') CFG.CICLO = j.c; } catch(e){}
}
async function munCode(ele){
  if (CFG.MUN.cd) return CFG.MUN.cd;
  const key = 'mun_'+ele+'_'+CFG.MUN.uf+'_'+norm(CFG.MUN.nome);
  const c = ls.get(key); if (c) return (CFG.MUN.cd = c);
  const j = await getJSON(`${CFG.CICLO}/${ele}/config/mun-e${pad(ele,6)}-cm.json`);
  const ufo = (j.abr||[]).find(a => norm(a.cd) === CFG.MUN.uf);
  const m = ufo && (ufo.mu||[]).find(x => norm(x.nm) === norm(CFG.MUN.nome));
  if (!m) throw new Error('Município não encontrado no arquivo do TSE');
  ls.set(key, m.cd); return (CFG.MUN.cd = m.cd);
}

/* ===== ANÚNCIOS ===== */
function renderAds(){
  [['adTop','top'],['adBot','bottom']].forEach(([id,k]) => {
    const a = CFG.ADS[k]; if (!a || !a.img) return;
    const img = `<img src="${esc(a.img)}" alt="${esc(a.alt||'Publicidade')}" loading="lazy">`;
    $(id).innerHTML = a.link ? `<a href="${esc(a.link)}" target="_blank" rel="sponsored noopener">${img}</a>` : img;
    $(id).style.border = '0'; $(id).style.background = 'transparent';
  });
}

/* ===== PARSE EA20 ===== */
function parse(j){
  const cands = [];
  ((j.carg||[])[0]?.agr||[]).forEach(a => (a.par||[]).forEach(p => (p.cand||[]).forEach(c => cands.push({
    nm: c.nmu || c.nm, n: c.n, sg: p.sg, vap: +c.vap || 0, pv: num(c.pvapn || c.pvap), pvap: c.pvap,
    e: c.e === 's', st: c.st || '', dvt: c.dvt || ''
  }))));
  cands.sort((a,b) => b.vap - a.vap);
  const s = j.s||{}, e = j.e||{}, v = j.v||{};
  return { cands, fim: j.and === 'f', dg: j.dg, hg: j.hg,
    pst: num(s.pstn || s.pst), pstTxt: s.pst || '0,00', st: s.st, ts: s.ts,
    pc: e.pc, pa: e.pa, pvb: v.pvb, ptvn: v.ptvn };
}

/* ===== CARDS ===== */
function card(title, r){
  if (r.err) return `<section class="card"><h2>${esc(title)}</h2><div class="msg ${r.soft?'':'err'}">${esc(r.err)}</div></section>`;
  const d = r.data, top = d.cands.slice(0,2);
  let duel = '';
  if (S.turno === 2 && top.length === 2 && (top[0].vap + top[1].vap) > 0) {
    const a = top[0].pv / ((top[0].pv + top[1].pv) || 1) * 100;
    duel = `<div class="duel"><div style="flex-basis:${a}%;background:${colorOf(top[0].n)}">${esc(top[0].pvap)}%</div><div style="flex-basis:${100-a}%;background:${colorOf(top[1].n)}">${esc(top[1].pvap)}%</div></div>`;
  }
  const rows = d.cands.map(c => `
    <div class="cand">
      <div class="nm">${esc(c.nm)} <small>${esc(c.sg)} · ${esc(c.n)}</small>${c.e?`<span class="badge">${esc(c.st||'Eleito')}</span>`:''}${/sub judice/i.test(c.dvt)?'<span class="badge sj">sub judice</span>':''}</div>
      <div class="pc">${esc(c.pvap||'0,00')}%</div>
      <div class="vt"><div class="bar"><i style="width:${Math.min(c.pv,100)}%;background:${colorOf(c.n)}"></i></div>${fmt(c.vap)} votos</div>
    </div>`).join('');
  return `<section class="card">
    <h2>${esc(title)} <span class="tag ${d.fim?'fim':''}">${d.fim?'Totalização final':esc(d.pstTxt)+'% seções'}</span></h2>
    <div class="meta">${fmt(d.st)} de ${fmt(d.ts)} seções · gerado ${esc(d.dg||'')} ${esc(d.hg||'')}</div>
    <div class="prog"><i style="width:${d.pst}%"></i></div>
    ${duel}${rows || '<div class="msg">Sem candidatos no arquivo.</div>'}
    <div class="tot">
      <div>Comparecimento<b>${esc(d.pc||'–')}%</b></div>
      <div>Abstenção<b>${esc(d.pa||'–')}%</b></div>
      <div>Brancos / Nulos<b>${esc(d.pvb||'–')}% / ${esc(d.ptvn||'–')}%</b></div>
    </div></section>`;
}

/* ===== HISTÓRICO (evolução) ===== */
const histKey = () => `h_${CFG.CICLO}_${S.turno}_${S.cargo}_${S.cargo===1?'br':S.uf}`;
function pushHist(d){
  const k = histKey(); let h = []; try { h = JSON.parse(ls.get(k)||'[]'); } catch(e){}
  const last = h[h.length-1];
  if (!last || last.x !== d.pst) {
    const v = {}; d.cands.slice(0,4).forEach(c => v[c.n] = c.pv);
    h.push({ x: d.pst, v }); if (h.length > 400) h = h.slice(-400);
    ls.set(k, JSON.stringify(h));
  }
  return h;
}

/* curva monotônica (não "inventa" picos entre leituras) */
function smoothPath(P){
  const n = P.length;
  if (n < 3) return 'M' + P.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join('L');
  const dx=[], m=[], t=[];
  for (let i=0;i<n-1;i++){ dx[i]=P[i+1][0]-P[i][0]; m[i]=dx[i] ? (P[i+1][1]-P[i][1])/dx[i] : 0; }
  t[0]=m[0]; t[n-1]=m[n-2];
  for (let i=1;i<n-1;i++) t[i] = m[i-1]*m[i] <= 0 ? 0 : (m[i-1]+m[i])/2;
  for (let i=0;i<n-1;i++){
    if (m[i]===0){ t[i]=t[i+1]=0; continue; }
    const a=t[i]/m[i], b=t[i+1]/m[i], s=a*a+b*b;
    if (s>9){ const k=3/Math.sqrt(s); t[i]=k*a*m[i]; t[i+1]=k*b*m[i]; }
  }
  let d = `M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
  for (let i=0;i<n-1;i++){ const h=dx[i]/3;
    d += `C${(P[i][0]+h).toFixed(1)},${(P[i][1]+t[i]*h).toFixed(1)} ${(P[i+1][0]-h).toFixed(1)},${(P[i+1][1]-t[i+1]*h).toFixed(1)} ${P[i+1][0].toFixed(1)},${P[i+1][1].toFixed(1)}`; }
  return d;
}
const curto = nm => { const p = String(nm).trim().split(/\s+/); return p.length > 1 ? p[0]+' '+p[p.length-1] : p[0]; };

let EVO = null;   // dados do gráfico para o hover
function evoSVG(h, cands){
  const nar=($('cmp')?.clientWidth||800)<560; const W=nar?420:760,H=nar?300:320,L=nar?38:46,R=nar?96:150,T=20,B=40, w=W-L-R, hh=H-T-B;
  const seen = new Map(); h.forEach(p => { if (p.x > 0) seen.set(p.x, p); });
  const pts = [...seen.values()].sort((a,b) => a.x - b.x);
  if (pts.length < 2) { EVO = null; return '<div class="msg">A curva se forma a cada atualização (precisa de 2 leituras com seções apuradas).</div>'; }
  const show = cands.slice(0, S.turno===2?2:4);
  const ys = []; pts.forEach(p => show.forEach(c => p.v[c.n]!=null && ys.push(p.v[c.n])));
  let y0 = Math.max(0, Math.floor((Math.min(...ys)-2)/5)*5), y1 = Math.min(100, Math.ceil((Math.max(...ys)+2)/5)*5);
  if (S.turno===2){ y0 = Math.min(y0,45); y1 = Math.max(y1,55); }
  const xMax = Math.max(25, Math.ceil(pts[pts.length-1].x/25)*25);   // zoom no trecho já apurado
  const X = x => L + x/xMax*w, Y = y => T + (1-(y-y0)/((y1-y0)||1))*hh;
  const step = (y1-y0) > 30 ? 10 : 5;
  let g = '', defs = '', areas = '', lines = '', ends = [];
  for (let y=y0; y<=y1; y+=step) g += `<line x1="${L}" x2="${L+w}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(y)+4}" text-anchor="end">${y}%</text>`;
  for (let x=0; x<=xMax; x+=xMax/4) g += `<line x1="${X(x)}" x2="${X(x)}" y1="${T}" y2="${T+hh}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${X(x)}" y="${T+hh+18}" text-anchor="middle">${Math.round(x)}%</text>`;
  g += `<text x="${L+w/2}" y="${H-4}" text-anchor="middle" style="font-size:11px">% de seções apuradas</text>`;
  if (S.turno===2) g += `<line x1="${L}" x2="${L+w}" y1="${Y(50)}" y2="${Y(50)}" stroke="var(--mut)" stroke-width="1.2" stroke-dasharray="6 5"/><text x="${L+4}" y="${Y(50)-5}" style="font-size:10px">50%</text>`;
  show.forEach((c, i) => {
    const col = colorOf(c.n), P = pts.filter(q => q.v[c.n]!=null).map(q => [X(q.x), Y(q.v[c.n])]);
    if (!P.length) return;
    const d = smoothPath(P), gid = 'gr'+i;
    defs += `<linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient>`;
    if (i < 2) areas += `<path d="${d}L${P[P.length-1][0].toFixed(1)},${T+hh}L${P[0][0].toFixed(1)},${T+hh}Z" fill="url(#${gid})"/>`;
    lines += `<path d="${d}" fill="none" stroke="${col}" stroke-width="${i<2?3:2}" stroke-linecap="round" stroke-linejoin="round"/>`;
    const lp = P[P.length-1];
    lines += `<circle cx="${lp[0]}" cy="${lp[1]}" r="9" fill="${col}" opacity=".18"><animate attributeName="r" values="5;11;5" dur="2s" repeatCount="indefinite"/></circle><circle cx="${lp[0]}" cy="${lp[1]}" r="4.5" fill="${col}" stroke="var(--card)" stroke-width="2"/>`;
    ends.push({ y: lp[1], x: lp[0], col, nm: nar ? String(c.nm).trim().split(/\s+/).pop().slice(0,11) : curto(c.nm), v: pts[pts.length-1].v[c.n] });
  });
  /* rótulos finais sem sobreposição */
  ends.sort((a,b) => a.y - b.y);
  for (let i=1;i<ends.length;i++) if (ends[i].y - ends[i-1].y < 30) ends[i].y = ends[i-1].y + 30;
  const lab = ends.map(e => `<line x1="${e.x+6}" x2="${L+w+10}" y1="${e.y}" y2="${e.y}" stroke="${e.col}" stroke-opacity=".35"/>
    <text x="${L+w+14}" y="${e.y-2}" style="font-size:16px;font-weight:800;fill:${e.col}">${pct(e.v)}%</text>
    <text x="${L+w+14}" y="${e.y+13}" style="font-size:11px">${esc(e.nm)}</text>`).join('');
  EVO = { pts, show, X, Y, L, T, w, hh, xMax, W, H };
  return `<div class="evo-wrap"><svg viewBox="0 0 ${W} ${H}" id="evoSvg" role="img" aria-label="Evolução dos votos válidos por seções apuradas">
    <defs>${defs}</defs>${g}${areas}${lines}${lab}
    <line id="evoX" y1="${T}" y2="${T+hh}" stroke="var(--tx)" stroke-opacity=".35" visibility="hidden"/><g id="evoDots"></g>
    <rect x="${L}" y="${T}" width="${w}" height="${hh}" fill="transparent" id="evoHit"/></svg>
    <div class="evo-tip" id="evoTip"></div></div>`;
}

function attachEvo(){
  const svg = $('evoSvg'); if (!svg || !EVO) return;
  const hit = $('evoHit'), vl = $('evoX'), dots = $('evoDots'), tip = $('evoTip');
  const move = ev => {
    const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) * EVO.W / r.width;
    const xv = (sx - EVO.L) / EVO.w * EVO.xMax;
    let p = EVO.pts[0]; EVO.pts.forEach(q => { if (Math.abs(q.x - xv) < Math.abs(p.x - xv)) p = q; });
    const px = EVO.X(p.x); vl.setAttribute('x1', px); vl.setAttribute('x2', px); vl.setAttribute('visibility','visible');
    const rows = EVO.show.filter(c => p.v[c.n]!=null).sort((a,b) => p.v[b.n]-p.v[a.n]);
    dots.innerHTML = rows.map(c => `<circle cx="${px}" cy="${EVO.Y(p.v[c.n])}" r="5" fill="${colorOf(c.n)}" stroke="var(--card)" stroke-width="2"/>`).join('');
    tip.innerHTML = `<b>${pct(p.x)}% das seções</b>` + rows.map(c => `<div><i style="background:${colorOf(c.n)}"></i>${esc(curto(c.nm))}<span>${pct(p.v[c.n])}%</span></div>`).join('')
      + (rows.length >= 2 ? `<div class="dif">Diferença: ${pct(p.v[rows[0].n]-p.v[rows[1].n])} p.p.</div>` : '');
    tip.style.display = 'block';
    const left = px / EVO.W * r.width;
    tip.style.left = Math.min(Math.max(left + 12, 0), r.width - tip.offsetWidth - 4) + 'px';
    tip.style.top = '8px';
  };
  const out = () => { vl.setAttribute('visibility','hidden'); dots.innerHTML = ''; tip.style.display = 'none'; };
  hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move); hit.addEventListener('pointerleave', out);
}

/* ===== COMPARATIVO ===== */
function renderCompare(labels, res){
  const ok = labels.map((l,i) => [l, res[i]]).filter(x => x[1].data && x[1].data.cands.some(c => c.vap > 0));
  if (!ok.length) { $('cmp').innerHTML = '<h2>Comparativo</h2><div class="msg">Os gráficos aparecem assim que houver votos apurados.</div>'; return; }
  const K = S.turno === 2 ? 2 : 4, leg = new Map();
  const rows = ok.map(([l, r]) => {
    const d = r.data, top = d.cands.slice(0,K), resto = Math.max(0, 100 - top.reduce((s,c) => s + c.pv, 0));
    top.forEach(c => leg.set(c.n, c));
    const seg = top.map(c => `<div style="flex-basis:${c.pv}%;background:${colorOf(c.n)}" title="${esc(c.nm)}: ${esc(c.pvap)}%">${c.pv>=7?pct(c.pv)+'%':''}</div>`).join('')
      + (resto > 0.05 ? `<div style="flex-basis:${resto}%;background:#9aa6a6" title="Outros: ${pct(resto)}%">${resto>=7?pct(resto)+'%':''}</div>` : '');
    return `<div class="crow"><div class="lb">${esc(l)}<small>${esc(d.pstTxt)}% seções</small></div><div class="stack">${seg}</div></div>`;
  }).join('');
  const legend = [...leg.values()].map(c => `<span><i style="background:${colorOf(c.n)}"></i>${esc(c.nm)} (${esc(c.sg)})</span>`).join('')
    + (S.turno===1 ? '<span><i style="background:#9aa6a6"></i>Outros</span>' : '');
  const main = res[0]?.data;
  const evo = main && main.cands.some(c => c.vap > 0) ? evoSVG(pushHist(main), main.cands) : '<div class="msg">Sem dados para a evolução.</div>';
  const tc = main ? main.cands.filter(c => c.vap > 0) : [];
  const dif = tc.length >= 2 ? `<span class="lead" style="color:${colorOf(tc[0].n)}">${esc(curto(tc[0].nm))} lidera por ${pct(tc[0].pv - tc[1].pv)} p.p. · ${fmt(tc[0].vap - tc[1].vap)} votos</span>` : '';
  $('cmp').innerHTML = `<h2>Comparativo · % de votos válidos</h2>${rows}<div class="legend">${legend}</div>
    <h3>Evolução da apuração · ${esc(labels[0])} ${dif}</h3><div class="evo">${evo}</div>`;
  attachEvo();
}

/* ===== CARGA ===== */
async function loadOne(ele, abr, cargo){
  try { return { data: parse(await getJSON(resPath(ele, abr, cargo))) }; }
  catch(e){
    if (e.status === 404 || e.status === 403) { S.backoff = 1; const h = +new Date().toLocaleString('en-US',{timeZone:'America/Sao_Paulo',hour:'numeric',hour12:false}); return { err: h < 17 ? 'A divulgação do TSE começa às 17h (horário de Brasília). A página atualiza sozinha.' : 'Arquivo ainda não publicado pelo TSE. Nova tentativa em 5 min.', soft:true }; }
    if (e instanceof TypeError) return { err:'Bloqueio do navegador (CORS/rede). Configure CFG.PROXY.' };
    return { err: e.message };
  }
}

async function refresh(){
  if (S.busy) return; S.busy = true; S.backoff = 0;
  $('status').textContent = 'Atualizando…';
  const t = CFG.TURNOS[S.turno], jobs = [];
  if (S.cargo === 1) {
    jobs.push(['Brasil', loadOne(t.fed, 'br', 1)]);
    jobs.push(['Minas Gerais', loadOne(t.fed, 'mg', 1)]);
    jobs.push([`${CFG.MUN.nome[0]+CFG.MUN.nome.slice(1).toLowerCase()} – ${CFG.MUN.uf}`,
      munCode(t.fed).then(cd => loadOne(t.fed, CFG.MUN.uf.toLowerCase()+cd, 1))
                    .catch(e => ({ err:'Código do município: '+e.message, soft:true }))]);
    jobs.push(['Exterior', loadOne(t.fed, 'zz', 1)]);   // abrangência ZZ = votos no exterior (já somados no total Brasil)
  } else {
    jobs.push([`Governador – ${S.uf}`, loadOne(t.est, S.uf.toLowerCase(), 3)]);
  }
  const res = await Promise.all(jobs.map(j => j[1]));
  const labels = jobs.map(j => j[0]);
  res.forEach(r => r.data && r.data.cands.forEach(c => colorOf(c.n)));   // cores fixas pela ordem da 1ª leitura
  $('grid').innerHTML = labels.map((l,i) => card(l, res[i])).join('');
  S.last = [labels, res];
  renderCompare(labels, res);
  S.left = S.backoff ? 300 : CFG.REFRESH;
  $('status').textContent = `Consultado ${new Date().toLocaleTimeString('pt-BR')}`;
  S.busy = false;
}

/* ===== UI ===== */
function fillUF(){
  const sel = $('selUF'), list = CFG.UF_GOV[S.turno];
  if (!list.includes(S.uf)) S.uf = list[0];
  sel.innerHTML = list.map(x => `<option ${x===S.uf?'selected':''}>${x}</option>`).join('');
  sel.hidden = S.cargo !== 3;
}
function resetView(){ S.colors = {}; S.ci = 0; fillUF(); refresh(); }
function bindSeg(id, attr, key){
  $(id).addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    [...$(id).children].forEach(x => x.classList.toggle('on', x === b));
    S[key] = +b.dataset[attr]; resetView();
  });
}
bindSeg('segTurno','t','turno'); bindSeg('segCargo','c','cargo');
$('selUF').onchange = e => { S.uf = e.target.value; S.colors = {}; S.ci = 0; refresh(); };
$('btnNow').onclick = refresh;
let rzT; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (S.last) renderCompare(S.last[0], S.last[1]); }, 250); });
$('btnAuto').onclick = () => { S.auto = !S.auto; $('btnAuto').textContent = 'Auto: ' + (S.auto?'ligado':'desligado'); };
setInterval(() => {
  if (!S.auto || document.hidden || S.busy) return;
  if (--S.left <= 0) refresh();
  else if (S.left <= 10) $('status').textContent = `Próxima em ${S.left}s`;
}, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.auto && S.left < CFG.REFRESH - 15) refresh(); });

const q = new URLSearchParams(location.search);
if (q.get('t')) S.turno = +q.get('t'); if (q.get('c')) S.cargo = +q.get('c'); if (q.get('uf')) S.uf = q.get('uf').toUpperCase();
document.querySelectorAll('#segTurno button').forEach(b => b.classList.toggle('on', +b.dataset.t === S.turno));
document.querySelectorAll('#segCargo button').forEach(b => b.classList.toggle('on', +b.dataset.c === S.cargo));
fillUF(); renderAds();
initCiclo().finally(refresh);
</script>
